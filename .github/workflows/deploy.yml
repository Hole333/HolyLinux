name: Build and deploy HaloMoon

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: halomoon-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Checkout notes
        uses: actions/checkout@v4
        with:
          repository: Hole333/HaloMoon-Notes
          path: external-notes
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: tar -czf site.tar.gz -C dist .
      - name: Configure SSH
        env:
          DEPLOY_KEY: ${{ secrets.HALOMOON_DEPLOY_KEY }}
          KNOWN_HOSTS: ${{ secrets.HALOMOON_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
      - name: Check remote disk and upload release
        env:
          DEPLOY_HOST: ${{ secrets.HALOMOON_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.HALOMOON_DEPLOY_USER }}
        run: |
          SSH_OPTS="-o ConnectTimeout=15 -o ServerAliveInterval=10 -o ServerAliveCountMax=3 -o TCPKeepAlive=yes"
          ARCHIVE_BYTES=$(stat -c%s site.tar.gz)
          ARCHIVE_KB=$(( (ARCHIVE_BYTES + 262144000) / 1024 ))
          REMOTE_DF=$(timeout 30s ssh $SSH_OPTS "$DEPLOY_USER@$DEPLOY_HOST" "df -Pk /")
          REMOTE_FREE_KB=$(printf '%s\n' "$REMOTE_DF" | awk 'NR==2 {print $4}')
          echo "Remote free space: ${REMOTE_FREE_KB} KB; required: ${ARCHIVE_KB} KB"
          if [ "$REMOTE_FREE_KB" -lt "$ARCHIVE_KB" ]; then
            echo "Remote disk space is too low for a safe deployment." >&2
            exit 1
          fi
          for attempt in 1 2 3; do
            timeout 30s ssh $SSH_OPTS "$DEPLOY_USER@$DEPLOY_HOST" "rm -f /home/$DEPLOY_USER/site.tar.gz"
            if timeout 180s scp $SSH_OPTS site.tar.gz "$DEPLOY_USER@$DEPLOY_HOST:/home/$DEPLOY_USER/site.tar.gz"; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "SCP failed after 3 attempts." >&2
              exit 1
            fi
            sleep $((attempt * 5))
          done
          LOCAL_SHA=$(sha256sum site.tar.gz | awk '{print $1}')
          REMOTE_SHA=$(timeout 30s ssh $SSH_OPTS "$DEPLOY_USER@$DEPLOY_HOST" "sha256sum /home/$DEPLOY_USER/site.tar.gz" | awk '{print $1}')
          test "$LOCAL_SHA" = "$REMOTE_SHA"
      - name: Activate release
        env:
          DEPLOY_HOST: ${{ secrets.HALOMOON_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.HALOMOON_DEPLOY_USER }}
        run: |
          timeout 120s ssh -o ConnectTimeout=15 -o ServerAliveInterval=10 -o ServerAliveCountMax=3 "$DEPLOY_USER@$DEPLOY_HOST" "sudo /usr/local/sbin/deploy-halomoon $GITHUB_SHA"